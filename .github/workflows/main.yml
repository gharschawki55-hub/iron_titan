name: Build IRON TITAN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o iron_titan_full_project.zip -d project
          ls project
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build APK
        run: |
          cd project
          find . -name "pubspec.yaml" | head -1
          cd $(dirname $(find . -name "pubspec.yaml" | head -1))
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-titan-apk
          path: project/**/build/app/outputs/flutter-apk/app-release.apk
