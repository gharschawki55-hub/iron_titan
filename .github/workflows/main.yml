name: Build IRON TITAN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o iron_titan_full_project.zip -d project
          find project -name "pubspec.yaml"
          ls -R project | head -n 200
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build APK
        run: |
          cd project
          APP_DIR=$(dirname $(find . -name "pubspec.yaml" | head -1))
          echo "APP_DIR=$APP_DIR"
          cd $APP_DIR
          sed -i "s/flutter_launcher_icons: \^0.13.3/flutter_launcher_icons: ^0.14.4/" pubspec.yaml || true
          flutter pub get
          echo "--- CURRENT DIR ---"
          pwd
          ls -la
          if [ ! -d "android" ]; then cd ..; echo "Moved up one"; pwd; ls -la; fi
          if [ ! -d "android" ]; then cd ..; echo "Moved up two"; pwd; ls -la; fi
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-titan-apk
          path: project/**/app-release.apk
