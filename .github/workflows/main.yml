name: Build IRON TITAN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o iron_titan_full_project.zip -d project
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build APK
        run: |
          cd project
          APP_DIR=$(dirname $(find . -name "pubspec.yaml" | head -1))
          cd $APP_DIR
          sed -i "s/flutter_launcher_icons: \^0.13.3/flutter_launcher_icons: ^0.14.4/" pubspec.yaml || true
          sed -i "s/google_mobile_ads: .*/google_mobile_ads: ^6.0.0/" pubspec.yaml || true
          flutter pub upgrade --major-versions
          flutter pub get
          flutter create . --platforms=android --org com.irontitan.app --project-name iron_titan
          python3 -c "
          import pathlib
          p = pathlib.Path('lib/main.dart')
          t = p.read_text()
          t = t.replace('state.languageCode', \"(state as dynamic).languageCode ?? 'en'\")
          p.write_text(t)
          print('patched main.dart')
          print(p.read_text()[:2000])
          "
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-titan-apk
          path: project/**/app-release.apk
